<svg xmlns="http://www.w3.org/2000/svg" width="720" height="480" viewBox="0 0 720 480">
  <rect width="720" height="480" fill="#141414"/>
  <text x="24" y="48" fill="#c4a35a" font-family="Segoe UI, sans-serif" font-size="28">Orchestra</text>
  <text x="24" y="80" fill="#aaa" font-family="Segoe UI, sans-serif" font-size="14">Find my toys, then Start. Dry run is on until you uncheck it.</text>
  <rect x="24" y="104" width="320" height="36" fill="#2a2a2a"/>
  <text x="36" y="128" fill="#eee" font-family="Segoe UI, sans-serif" font-size="14">Find my toys</text>
  <text x="24" y="176" fill="#eee" font-family="Segoe UI, sans-serif" font-size="16">Lovense Hush  →  lead</text>
  <text x="24" y="204" fill="#eee" font-family="Segoe UI, sans-serif" font-size="16">Lovense Edge  →  pulse</text>
  <text x="24" y="232" fill="#eee" font-family="Segoe UI, sans-serif" font-size="16">The Handy  →  stroker</text>
  <text x="24" y="270" fill="#888" font-family="Segoe UI, sans-serif" font-size="14">Stroke depth 0.55</text>
  <rect x="24" y="282" width="400" height="8" fill="#2a2a2a"/>
  <rect x="24" y="282" width="220" height="8" fill="#c4a35a"/>
  <rect x="24" y="320" width="140" height="32" fill="#2a2a2a"/>
  <text x="40" y="341" fill="#eee" font-family="Segoe UI, sans-serif" font-size="14">Hear the phrase</text>
  <rect x="176" y="320" width="80" height="32" fill="#c4a35a"/>
  <text x="198" y="341" fill="#141414" font-family="Segoe UI, sans-serif" font-size="14">Start</text>
  <rect x="268" y="320" width="80" height="32" fill="#2a2a2a"/>
  <text x="290" y="341" fill="#eee" font-family="Segoe UI, sans-serif" font-size="14">Stop</text>
  <text x="24" y="390" fill="#d8d2c6" font-family="Consolas, monospace" font-size="13">boss phrase, stroker depth 0.55</text>
  <text x="24" y="412" fill="#d8d2c6" font-family="Consolas, monospace" font-size="13">lead, pulse, sustain, stroker</text>
</svg>
